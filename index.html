<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAS FY27 Q1 Spending Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#0B1624; font-family:Inter, system-ui, sans-serif; color:#EEF2F7 }
  .app { position:fixed; inset:0; display:flex; flex-direction:column }
  .viewport { flex:1; position:relative; overflow:hidden; cursor:pointer }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; transform-origin:0 0;
    --display:'Space Grotesk', system-ui, sans-serif; --sans:'Inter', system-ui, sans-serif }
  .scene { position:absolute; inset:0; display:none }
  .bar { display:flex; align-items:center; gap:14px; padding:10px 16px; background:#0E1B2B; border-top:1px solid #1E2E44; flex-wrap:wrap }
  .bar button { background:#12355B; color:#EEF2F7; border:0; border-radius:6px; padding:8px 14px; font:600 14px Inter, system-ui, sans-serif; cursor:pointer; min-width:44px }
  .bar button:hover { background:#1B4A7D }
  .bar input[type=range] { flex:1; min-width:160px; accent-color:#2F9C95 }
  .time { font:500 14px Inter, system-ui, sans-serif; font-variant-numeric:tabular-nums; min-width:96px; text-align:center }
  .chap { background:#12355B; color:#EEF2F7; border:0; border-radius:6px; padding:8px 10px; font:14px Inter, system-ui, sans-serif }
  .err { position:absolute; left:16px; bottom:16px; color:#ffb4a8; font:13px monospace; white-space:pre-wrap }
</style>
</head>
<body>
<div class="app">
  <div class="viewport" id="vp"><div id="stage"></div></div>
  <div class="bar">
    <button id="play" aria-label="Play">Play</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Seek">
    <select class="chap" id="chap" aria-label="Jump to scene"></select>
    <button id="snd" aria-label="Sound">Sound off</button>
    <button id="fs" aria-label="Full screen">Full screen</button>
  </div>
</div>
<style id="film-css">#stage { --ground:#F6F7F9; --main:#12355B; --second:#1B2330; --accent:#2F9C95; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; color:var(--main) } .sub { font-size:34px; line-height:1.3 }
#stage { --rule:color-mix(in srgb, var(--second) 14%, var(--ground)); --muted:color-mix(in srgb, var(--second) 62%, var(--ground)); --pale:color-mix(in srgb, var(--main) 14%, var(--ground)); --mid:color-mix(in srgb, var(--main) 45%, var(--ground)); --tealwash:color-mix(in srgb, var(--accent) 16%, var(--ground)); --paper:color-mix(in srgb, var(--ground) 60%, white) }
.cam { position:absolute; inset:0; transform-origin:960px 540px }
.sheet { position:absolute; left:60px; top:44px; right:60px; bottom:44px; background:var(--paper); box-shadow:0 2px 0 var(--rule), 0 18px 50px rgba(0,0,0,.06); border-top:10px solid var(--main) }
.kick { font-size:24px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--accent) }
.head { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:64px; line-height:1.08; font-weight:700; color:var(--main); letter-spacing:-.01em }
.deck { font-size:30px; line-height:1.35; color:var(--muted) }
.foot { position:absolute; left:130px; right:130px; bottom:84px; display:flex; justify-content:space-between; gap:40px; font-size:20px; color:var(--muted); border-top:2px solid var(--rule); padding-top:14px; flex-wrap:wrap; row-gap:6px }
.lab { font-size:28px; line-height:1.2; color:var(--second) } .lab.m { color:var(--muted) }
.num { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-variant-numeric:tabular-nums; font-weight:700; color:var(--main); line-height:1 }
.tag { display:inline-block; padding:6px 14px; border-radius:6px; font-size:22px; font-weight:700; letter-spacing:.06em; text-transform:uppercase }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }</style>
<script>
(function () {
  'use strict';
  const SCENES = {"scenes": [{"id": "title", "name": "Q1 at a glance", "dur": 8, "desc": "Title: DAS FY27 first quarter, $28.64M across 18 providers and 24 fund sources."}, {"id": "pace", "name": "On the line", "dur": 12, "desc": "Cumulative utilization tracks the straight-line pace target July through September."}, {"id": "runrate", "name": "Run rate", "dur": 10, "desc": "Q1 averaged $2.40M a month against $2.38M a month needed for the rest of the year."}, {"id": "concentration", "name": "Where the money sits", "dur": 11, "desc": "Five providers hold 73% of the budget; ARC AAA alone holds a third."}, {"id": "spread", "name": "Wide spread", "dur": 14, "desc": "September utilization by provider ranges from 0% to 55.5% around the 25% target."}, {"id": "offsets", "name": "Offsetting gaps", "dur": 13, "desc": "Dollars ahead of pace at DeKalb, Fulton and Cobb offset dollars behind at ARC AAA and Gwinnett."}, {"id": "zero", "name": "No payments yet", "dur": 11, "desc": "Three providers holding $3.12M show no payments through September."}, {"id": "momentum", "name": "Momentum", "dur": 14, "desc": "Monthly run rates project when front-loaded providers reach 100% and where ARC AAA lands."}, {"id": "funds", "name": "Fund sources", "dur": 13, "desc": "Title III B and C2 run ahead; HCBS State, Title III E and Respite trail pace."}, {"id": "categories", "name": "By category", "dur": 10, "desc": "Category utilization and how many providers and funds sit at or near target."}, {"id": "next", "name": "Questions ahead", "dur": 12, "desc": "Four questions to carry into October reporting."}, {"id": "end", "name": "End card", "dur": 7, "desc": "On pace overall, uneven underneath; source and credit."}]};
  // ---- easing & helpers (pure functions of t) ----
  const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const ei = (x) => Math.pow(clamp01(x), 3);
  const eio = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const eob = (x, s) => { x = clamp01(x); s = s == null ? 1.4 : s; const y = x - 1; return 1 + (s + 1) * y * y * y + s * y * y; };
  const TextFx = {
    fadeFromRight(el, t, t0, o) {
      o = o || {};
      const st = o.stagger || 0.11, d = o.dur || 0.5, dx = o.dx || 30;
      if (!el.__w) {
        const words = el.textContent.split(' ');
        el.textContent = '';
        el.__w = words.map((w, i) => {
          const s = document.createElement('span');
          s.textContent = w; s.style.display = 'inline-block';
          el.appendChild(s);
          if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
          return s;
        });
      }
      el.__w.forEach((s, i) => {
        const a = eo(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = a; s.style.transform = 'translateX(' + ((1 - a) * dx).toFixed(1) + 'px)';
      });
    },
  };
  const h = (html) => {
    const tpl = document.createElement('template'); tpl.innerHTML = html.trim();
    const kids = tpl.content.children;
    if (kids.length === 1) return kids[0];
    const box = document.createElement('div'); box.style.display = 'contents';
    Array.from(tpl.content.childNodes).forEach((n) => box.appendChild(n)); return box;
  };
  const base = { seg, lerp, clamp01, eo, ei, eio, eob, TextFx, h, W: 1920, H: 1080 };

  // ---- build the timeline ----
  const stage = document.getElementById('stage');
  const defs = {};
  let start = 0;
  const T = {};
  const list = SCENES.scenes.map((s) => { const o = { id: s.id, name: s.name, dur: s.dur, start }; T[s.id] = start; start += s.dur; return o; });
  const TOTAL = start; T.END = TOTAL;
  const modKit = Object.assign({}, base, { scene(id, def) { defs[id] = def; }, scenes() { return null; }, score(fn) { scoreFn = fn; } });
  let scoreFn = null;
  window.W = undefined;
  const MODULES = [function (kit) {
// The briefing book. Every scene is one exhibit page on the same paper, under the same navy rule.
window.W = {
  // An exhibit page: paper sheet, kicker, headline, deck line and source footer. Returns markup.
  page(id, kick, head, deck, inner) {
    return '<div class="ground"><div class="cam ' + id + '-cam"><div class="sheet"></div>' +
      '<div class="words ' + id + '-hd" style="left:130px;top:110px;width:1500px;gap:14px"><p class="kick">' + kick + '</p><h2 class="head">' + head + '</h2>' + (deck ? '<p class="deck">' + deck + '</p>' : '') + '</div>' +
      inner +
      '<div class="foot"><span>Source: FY27 DAS Budgets vs. YTD Payments, July to September 2026</span><span>Design, development & analysis by Damon Smith · ARC Aging & Independence Services</span></div></div></div>';
  },
  // Wire a page's standard parts after it is appended.
  bind(kit, id, self) {
    const q = (s) => kit.stage.querySelector(s);
    self.cam = q('.' + id + '-cam');
    self.hd = Array.from(q('.' + id + '-hd').children);
  },
  // Shared motion for a page: a slow 2% push, and the headline block rising in line by line.
  move(kit, self, t) {
    const p = kit.eio(kit.seg(t, 0, kit.dur));
    self.cam.style.transform = 'scale(' + kit.lerp(1.0, 1.02, p).toFixed(4) + ')';
    self.hd.forEach((el, i) => {
      const a = kit.eo(kit.seg(t, -0.4 + i * 0.25, 0.3 + i * 0.25));
      el.style.opacity = a; el.style.transform = 'translateY(' + ((1 - a) * 26).toFixed(1) + 'px)';
    });
  },
  // Fade and lift any element in from below over 0.5 s.
  rise(kit, el, t, t0, dy) {
    const a = kit.eo(kit.seg(t, t0, t0 + 0.5));
    el.style.opacity = a; el.style.transform = 'translateY(' + ((1 - a) * (dy == null ? 24 : dy)).toFixed(1) + 'px)';
    return a;
  },
  money(v, d) {
    const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(d == null ? 2 : d) + 'M';
    return s + '$' + Math.round(a / 1e3) + 'K';
  },
  pct(v, d) { return v.toFixed(d == null ? 1 : d) + '%'; },
};

},
function (kit) {
const { seg, eo, eio, lerp, clamp01 } = kit;
kit.scene('title', {
  init(kit) {
    const ticks = Array.from({ length: 13 }, (_, i) => '<div style="position:absolute;left:' + (i * 100 / 12) + '%;top:-10px;width:2px;height:' + (i % 3 === 0 ? 46 : 30) + 'px;background:var(--rule)"></div>').join('');
    const months = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
    const ml = months.map((m, i) => '<span class="lab m" style="position:absolute;top:44px;left:' + ((i + 0.5) * 100 / 12) + '%;transform:translateX(-50%);font-size:22px">' + m + '</span>').join('');
    kit.stage.append(kit.h('<div class="ground"><div class="cam title-cam"><div class="sheet"></div>' +
      '<div class="words title-words" style="left:150px;top:150px;width:1560px;gap:26px"><p class="kick title-k">DAS FY27 · First quarter review · July to September 2026</p><h1 class="line title-line" style="font-size:132px;letter-spacing:-.02em">On pace overall, uneven underneath</h1><p class="deck title-deck">How $28.64M in Area Agency on Aging funding moved through 18 providers and 24 fund sources in Q1</p></div>' +
      '<div class="title-bar" style="position:absolute;left:150px;right:150px;top:760px;height:26px;background:var(--pale);border-radius:13px"><div class="title-fill" style="position:absolute;left:0;top:0;bottom:0;border-radius:13px;background:var(--main)"></div><div class="title-goal" style="position:absolute;left:25%;top:-22px;bottom:-22px;width:4px;background:var(--accent)"></div>' + ticks + ml + '</div>' +
      '<div class="words title-stat" style="left:150px;top:660px;flex-direction:row;gap:40px;align-items:baseline"><span class="num title-n" style="font-size:64px">25.1%</span><span class="lab m title-l">of the FY27 budget paid through September, against a 25.0% pace target</span></div>' +
      '<div class="foot"><span>Source: FY27 DAS Budgets vs. YTD Payments, July to September 2026</span><span>Design, development & analysis by Damon Smith · ARC Aging & Independence Services</span></div></div></div>'));
    const q = (s) => kit.stage.querySelector(s);
    Object.assign(this, { cam: q('.title-cam'), k: q('.title-k'), line: q('.title-line'), deck: q('.title-deck'), bar: q('.title-bar'), fill: q('.title-fill'), goal: q('.title-goal'), stat: q('.title-stat'), n: q('.title-n') });
  },
  render(t, kit) {
    this.cam.style.transform = 'scale(' + lerp(1.0, 1.025, eio(seg(t, 0, 8))).toFixed(4) + ')';
    W.rise(kit, this.k, t, -0.5, 20);
    kit.TextFx.fadeFromRight(this.line, t, -0.4);
    W.rise(kit, this.deck, t, 1.0, 20);
    W.rise(kit, this.bar, t, 1.8, 16);
    const f = eio(seg(t, 2.3, 4.6));
    this.fill.style.width = (25.11 * f).toFixed(2) + '%';
    this.goal.style.opacity = eo(seg(t, 2.0, 2.5));
    W.rise(kit, this.stat, t, 2.4, 16);
    this.n.textContent = (12.5 + 12.61 * f).toFixed(1) + '%';
  },
});

},
function (kit) {
const { seg, eo, eio, eob, lerp } = kit;
kit.scene('pace', {
  init(kit) {
    const X = [240, 600, 960, 1320], Y = (p) => 820 - p * 15.5;
    const act = [0, 7.67, 16.77, 25.11], tgt = [0, 8.33, 16.67, 25.0];
    this.X = X; this.Y = Y; this.act = act;
    let grid = '';
    [0, 10, 20, 30].forEach((p) => { grid += '<line x1="200" x2="1360" y1="' + Y(p) + '" y2="' + Y(p) + '" style="stroke:var(--rule);stroke-width:2"/>'; });
    const pts = (arr) => arr.map((p, i) => X[i] + ',' + Y(p)).join(' ');
    const svg = '<svg class="art pace-chart" viewBox="0 0 1920 1080"><defs><clipPath id="pace-c1"><rect class="pace-r1" x="200" y="300" height="560" width="0"/></clipPath><clipPath id="pace-c2"><rect class="pace-r2" x="200" y="300" height="560" width="0"/></clipPath></defs>' +
      '<g class="pace-grid">' + grid + '<line x1="240" x2="240" y1="' + Y(0) + '" y2="' + Y(31) + '" style="stroke:var(--rule);stroke-width:2"/></g>' +
      '<g class="pace-target" clip-path="url(#pace-c1)"><polyline points="' + pts(tgt) + '" style="fill:none;stroke:var(--accent);stroke-width:5;stroke-dasharray:14 10"/></g>' +
      '<g class="pace-actual" clip-path="url(#pace-c2)"><polygon points="' + pts(act) + ' 1320,' + Y(0) + ' 240,' + Y(0) + '" style="fill:color-mix(in srgb, var(--main) 10%, transparent)"/><polyline points="' + pts(act) + '" style="fill:none;stroke:var(--main);stroke-width:7;stroke-linejoin:round"/></g>' +
      act.slice(1).map((p, i) => '<g class="pace-dot pace-dot' + i + '"><circle cx="' + X[i + 1] + '" cy="' + Y(p) + '" r="14" style="fill:var(--main);stroke:var(--paper);stroke-width:5"/></g>').join('') + '</svg>';
    const yl = [0, 10, 20, 30].map((p) => '<span class="lab m pace-yl" style="position:absolute;left:130px;top:' + (Y(p) - 16) + 'px;font-size:24px">' + p + '%</span>').join('');
    const xl = ['July', 'August', 'September'].map((m, i) => '<span class="lab m pace-xl" style="position:absolute;top:842px;left:' + X[i + 1] + 'px;transform:translateX(-50%)">' + m + '</span>').join('');
    const cl = ['7.7% vs 8.3%', '16.8% vs 16.7%', '25.1% vs 25.0%'].map((s, i) => '<div class="pace-call" style="position:absolute;left:' + (X[i + 1] - 230) + 'px;top:' + (Y(act[i + 1]) - 96) + 'px;width:220px;text-align:right"><span class="num" style="font-size:30px">' + s + '</span></div>').join('');
    const rows = [['July', 2.197], ['August', 2.607], ['September', 2.387]].map((r) => '<div class="pace-row" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between"><span class="lab">' + r[0] + '</span><span class="num" style="font-size:34px">$' + r[1].toFixed(2) + 'M</span></div><div style="height:16px;background:var(--pale);border-radius:8px"><div class="pace-b" style="height:100%;width:' + (r[1] / 2.8 * 100) + '%;background:var(--main);border-radius:8px;transform-origin:0 0"></div></div></div>').join('');
    const panel = '<div class="words pace-panel" style="left:1440px;top:330px;width:360px;gap:30px"><p class="kick" style="color:var(--muted)">Paid each month</p>' + rows + '<p class="lab m pace-note" style="font-size:24px">Pace line: one-twelfth of the annual budget each month</p></div>';
    const leg = '<div class="words pace-leg" style="left:280px;top:340px;gap:12px"><div style="display:flex;gap:14px;align-items:center"><span style="width:44px;height:7px;background:var(--main)"></span><span class="lab">Actual YTD utilization</span></div><div style="display:flex;gap:14px;align-items:center"><span style="width:44px;height:0;border-top:5px dashed var(--accent)"></span><span class="lab">Straight-line pace target</span></div></div>';
    kit.stage.append(kit.h(W.page('pace', 'Exhibit 1 · Portfolio pace', 'Spending matched the pace target in each month of Q1', '', svg + yl + xl + cl + leg + panel)));
    W.bind(kit, 'pace', this);
    const q = (s) => kit.stage.querySelector(s), qa = (s) => Array.from(kit.stage.querySelectorAll(s));
    Object.assign(this, { r1: q('.pace-r1'), r2: q('.pace-r2'), dots: qa('.pace-dot'), calls: qa('.pace-call'), grid: q('.pace-grid'), yl: qa('.pace-yl'), xl: qa('.pace-xl'), rows: qa('.pace-row'), bars: qa('.pace-b'), panelK: q('.pace-panel').firstChild, note: q('.pace-note'), leg: q('.pace-leg') });
  },
  render(t, kit) {
    W.move(kit, this, t);
    const g = eo(seg(t, 0.6, 1.2));
    this.grid.style.opacity = g; this.yl.forEach((e) => e.style.opacity = g); this.xl.forEach((e) => e.style.opacity = g);
    W.rise(kit, this.leg, t, 1.0, 14);
    this.r1.setAttribute('width', (1160 * eio(seg(t, 1.2, 3.0))).toFixed(1));
    this.r2.setAttribute('width', (1160 * eio(seg(t, 2.0, 6.2))).toFixed(1));
    this.dots.forEach((d, i) => {
      const at = 2.0 + 4.2 * ((this.X[i + 1] - 200) / 1160) - 0.1;
      const s = eob(seg(t, at, at + 0.5), 1.7);
      const c = d.firstChild; c.setAttribute('r', (14 * s).toFixed(2));
      W.rise(kit, this.calls[i], t, at + 0.3, 16);
    });
    W.rise(kit, this.panelK, t, 6.8, 16);
    this.rows.forEach((r, i) => { W.rise(kit, r, t, 7.1 + i * 0.35, 18); this.bars[i].style.transform = 'scaleX(' + eio(seg(t, 7.3 + i * 0.35, 8.1 + i * 0.35)).toFixed(3) + ')'; });
    W.rise(kit, this.note, t, 8.6, 14);
  },
});

},
function (kit) {
const { seg, eo, eio, eob, lerp } = kit;
kit.scene('runrate', {
  init(kit) {
    const m = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
    const v = [2.197, 2.607, 2.387].concat(Array(9).fill(2.383));
    const base = 820, k = 150, x0 = 170, cw = 90;
    let cols = '';
    v.forEach((val, i) => {
      const h = val * k, x = x0 + i * cw, done = i < 3;
      cols += '<div class="runrate-col" style="position:absolute;left:' + x + 'px;top:' + (base - h) + 'px;width:66px;height:' + h + 'px;transform-origin:50% 100%;border-radius:6px 6px 0 0;' + (done ? 'background:var(--main)' : 'background:var(--tealwash);border:3px dashed var(--accent);border-bottom:none') + '"></div>';
      cols += '<span class="lab m" style="position:absolute;top:' + (base + 14) + 'px;left:' + (x + 33) + 'px;transform:translateX(-50%);font-size:22px">' + m[i] + '</span>';
    });
    const avgY = base - 2.397 * k;
    const brace = '<div class="runrate-q" style="position:absolute;left:' + x0 + 'px;top:' + (base + 56) + 'px;width:' + (cw * 3 - 24) + 'px;border-top:3px solid var(--main);padding-top:8px"><span class="lab" style="font-size:24px">Q1 actual</span></div>' +
      '<div class="runrate-q" style="position:absolute;left:' + (x0 + cw * 3) + 'px;top:' + (base + 56) + 'px;width:' + (cw * 9 - 24) + 'px;border-top:3px dashed var(--accent);padding-top:8px"><span class="lab" style="font-size:24px">Needed each month to spend the remaining $21.45M</span></div>';
    const avg = '<div class="runrate-avg" style="position:absolute;left:' + (x0 - 20) + 'px;top:' + avgY + 'px;width:' + (cw * 12 + 10) + 'px;border-top:3px solid var(--second);transform-origin:0 0"></div>';
    const nums = '<div class="words runrate-nums" style="left:1330px;top:340px;width:440px;gap:40px">' +
      '<div class="runrate-a" style="display:flex;flex-direction:column;gap:10px"><span class="num runrate-n1" style="font-size:110px">$2.40M</span><span class="lab">Average paid per month in Q1</span></div>' +

      }
    },
    drums(map, o) {
      const rep = o.repeat || 1;
      Object.keys(map).forEach((name) => { const pat = map[name];
        for (let r = 0; r < rep; r++) for (let i = 0; i < pat.length; i++) { const c = pat[i]; if (c === '.') continue;
          EV.push({ k: 'd', name, t: bt((o.from || 0) + (r * pat.length + i) * 0.5), v: c === 'o' ? 40 : c === 'X' ? 110 : 80 }); } });
    },
    drum(name, o) { EV.push({ k: 'd', name, t: o.t != null ? o.t : bt(o.beat), v: o.vel || 80 }); },
    fx(name, t, o) { o = o || {}; EV.push({ k: 'f', name, t, d: o.dur || 0.5, v: o.vel || 60 }); },
    beat(n) { return n * 60 / bpm; },
  };
  if (scoreFn) { try { scoreFn(S, T); } catch (e) { errBox('Score: ' + e.message); } }
  const hz = (p) => { const m = /^([A-G])(#|b)?(-?\d)$/.exec(p); if (!m) return 440;
    const n = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (n + (+m[3] + 1) * 12 - 69) / 12); };
  let ac = null, bus = null, noiseBuf = null, soundOn = false;
  function ensureAudio() {
    if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); let s = 7; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; }
  }
  function tone(type, f, at, dur, g, atk, rel, dest) {
    const o = ac.createOscillator(), a = ac.createGain(); o.type = type; o.frequency.value = f;
    a.gain.setValueAtTime(0, at); a.gain.linearRampToValueAtTime(g, at + atk);
    a.gain.setValueAtTime(g, Math.max(at + atk, at + dur - rel)); a.gain.linearRampToValueAtTime(0, at + dur);
    o.connect(a); a.connect(dest); o.start(at); o.stop(at + dur + 0.05); return o;
  }
  function noise(at, dur, g, ftype, freq, dest, swell) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), a = ac.createGain();
    s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
    if (swell) { a.gain.setValueAtTime(0.0001, at); a.gain.exponentialRampToValueAtTime(g, at + dur); a.gain.linearRampToValueAtTime(0, at + dur + 0.05); }
    else { a.gain.setValueAtTime(g, at); a.gain.exponentialRampToValueAtTime(0.0001, at + dur); }
    s.connect(f); f.connect(a); a.connect(dest); s.start(at); s.stop(at + dur + 0.1);
  }
  function schedule(from) {
    ensureAudio(); if (ac.state === 'suspended') ac.resume();
    if (bus) { try { bus.disconnect(); } catch (e) {} }
    bus = ac.createGain(); bus.gain.value = 0.5; bus.connect(ac.destination);
    const now = ac.currentTime + 0.05;
    const fade = (S.m && S.m.fadeOut) || 0;
    if (fade) { const fe = now + (TOTAL - from); bus.gain.setValueAtTime(0.5, Math.max(now, fe - fade)); bus.gain.linearRampToValueAtTime(0, Math.max(now + 0.01, fe)); }
    EV.forEach((e) => {
      if (e.t < from - 0.02 || e.t > TOTAL) return;
      const at = now + (e.t - from), v = e.v / 127;
      if (e.k === 'n') {
        e.p.forEach((p) => { const f = hz(p);
          if (e.tr === 'pad') tone('triangle', f, at, e.d, v * 0.07, Math.min(0.8, e.d / 3), Math.min(0.9, e.d / 3), bus);
          else if (e.tr === 'bass') tone('sine', f, at, e.d, v * 0.22, 0.02, 0.3, bus);
          else tone('sine', f, at, Math.max(0.35, Math.min(e.d, 1.2)), v * 0.12, 0.005, Math.max(0.3, Math.min(e.d, 1.2)) - 0.01, bus);
        });
      } else if (e.k === 'd') {
        if (e.name === 'kick') { const o = ac.createOscillator(), a = ac.createGain(); o.frequency.setValueAtTime(120, at); o.frequency.exponentialRampToValueAtTime(45, at + 0.15);
          a.gain.setValueAtTime(v * 0.5, at); a.gain.exponentialRampToValueAtTime(0.0001, at + 0.3); o.connect(a); a.connect(bus); o.start(at); o.stop(at + 0.35); }
        else if (e.name === 'hat') noise(at, 0.05, v * 0.08, 'highpass', 7000, bus);
        else noise(at, 0.06, v * 0.12, 'bandpass', 1800, bus);
      } else {
        const n = e.name;
        if (n === 'whoosh') noise(at, e.d, v * 0.12, 'bandpass', 900, bus);
        else if (n === 'revswell') noise(at - e.d, e.d, v * 0.15, 'lowpass', 2500, bus, true);
        else if (n === 'tick') noise(at, 0.03, v * 0.25, 'highpass', 3000, bus);
        else if (n === 'pop') tone('sine', 660, at, 0.12, v * 0.18, 0.003, 0.1, bus);
        else if (n === 'ding') tone('sine', 1320, at, 0.9, v * 0.12, 0.003, 0.85, bus);
        else if (n === 'chime') { tone('sine', 1568, at, 1.4, v * 0.1, 0.003, 1.3, bus); tone('sine', 2093, at + 0.06, 1.2, v * 0.06, 0.003, 1.1, bus); }
      }
    });
  }
  function silence() { if (bus) { try { bus.disconnect(); } catch (e) {} bus = null; } }

  // ---- transport ----
  let playing = false, t = 0, last = 0, dragging = false;
  const playBtn = document.getElementById('play'), sndBtn = document.getElementById('snd');
  function play() { if (t >= TOTAL - 0.05) t = 0; playing = true; last = performance.now(); playBtn.textContent = 'Pause'; if (soundOn) schedule(t); requestAnimationFrame(tick); }
  function pause() { playing = false; playBtn.textContent = 'Play'; silence(); }
  function seek(x) { t = Math.max(0, Math.min(TOTAL, x)); render(t); if (playing && soundOn) schedule(t); }
  function tick(now) {
    if (!playing) return;
    t += (now - last) / 1000; last = now;
    if (t >= TOTAL) { t = TOTAL - 0.0001; render(t); pause(); return; }
    render(t); requestAnimationFrame(tick);
  }
  playBtn.onclick = () => playing ? pause() : play();
  let swallow = false;
  document.getElementById('vp').onclick = () => { if (swallow) { swallow = false; return; } playing ? pause() : play(); };
  sndBtn.onclick = () => { soundOn = !soundOn; sndBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; if (soundOn && playing) schedule(t); else silence(); };
  const scrub = document.getElementById('scrub');
  scrub.oninput = () => { dragging = true; seek(scrub.value / 1000 * TOTAL); };
  scrub.onchange = () => { dragging = false; };
  const chap = document.getElementById('chap');
  list.forEach((s, i) => { const o = document.createElement('option'); o.value = s.id; o.textContent = (i + 1) + '. ' + s.name; chap.appendChild(o); });
  chap.onchange = () => seek(list.find((s) => s.id === chap.value).start);
  document.getElementById('fs').onclick = () => { const a = document.querySelector('.app'); if (document.fullscreenElement) document.exitFullscreen(); else if (a.requestFullscreen) a.requestFullscreen(); };
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === 'ArrowRight') seek(t + 5); else if (e.code === 'ArrowLeft') seek(t - 5);
  });
  function fit() {
    const vp = document.getElementById('vp'), w = vp.clientWidth, hh = vp.clientHeight, s = Math.min(w / 1920, hh / 1080);
    stage.style.transform = 'translate(' + ((w - 1920 * s) / 2) + 'px,' + ((hh - 1080 * s) / 2) + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();
  window.__seek = (x) => { t = x; render(x); };
  // Autoplay with sound on. Browsers only allow audio after a click or key press,
  // so if the sound is blocked, a full-screen prompt starts it on the first click.
  soundOn = true; sndBtn.textContent = 'Sound on';
  const gate = document.createElement('div');
  gate.style.cssText = 'position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(11,22,36,.55);cursor:pointer;z-index:5';
  gate.innerHTML = '<div style="background:#12355B;color:#EEF2F7;padding:22px 34px;border-radius:12px;font:600 22px Inter,system-ui,sans-serif;border-top:5px solid #2F9C95;box-shadow:0 10px 40px rgba(0,0,0,.35)">Click anywhere to play with sound</div>';
  document.getElementById('vp').appendChild(gate);
  const unlock = () => {
    if (gate.style.display !== 'none') swallow = true;
    gate.style.display = 'none';
    document.removeEventListener('pointerdown', unlock, true); document.removeEventListener('keydown', unlock, true);
    ensureAudio();
    ac.resume().then(() => { t = 0; render(0); if (playing) schedule(0); else play(); setTimeout(() => { swallow = false; }, 600); });
  };
  function showGate() {
    if (gate.style.display === 'flex') return;
    gate.style.display = 'flex';
    document.addEventListener('pointerdown', unlock, true); document.addEventListener('keydown', unlock, true);
  }
  function autoStart() {
    ensureAudio();
    if (ac.state === 'running') { play(); return; }
    soundOn = false; play(); soundOn = true;           // picture starts at once
    showGate();                                       // sound joins on the first click or key
    ac.resume().then(() => {                          // some browsers allow it outright
      if (ac.state === 'running' && gate.style.display === 'flex') {
        gate.style.display = 'none';
        document.removeEventListener('pointerdown', unlock, true); document.removeEventListener('keydown', unlock, true);
        if (playing) schedule(t);
      }
    }).catch(() => {});
  }
  let started = false;
  const go = () => { if (started) return; started = true; autoStart(); };
  if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(go); else go();
})();
</script>
